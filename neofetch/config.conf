# ─────────────────────────────────────────────────────────────────────────────
#  Paperr · neofetch
#  A deliberately small config.  neofetch loads its built-in defaults first,
#  then sources this file, so these are safe overrides.
#
#  The ASCII is a sheet of paper with a hand-drawn Arch on it.  Run `neofetch`
#  in kitty, or press ctrl+shift+F5 for a fresh paper-fetch tab.
# ─────────────────────────────────────────────────────────────────────────────

print_info() {
    info title
    info underline

    info "os"        distro
    info "host"      model
    info "kernel"    kernel
    info "uptime"    uptime
    info "packages"  packages
    info "shell"     shell
    info "wm"        wm
    info "terminal"  term
    info "font"      term_font
    info "memory"    memory

    printf '\n'
    prin "paper" "warm off-white · ink · sky · brick · apricot"
    prin "dots"  "Paperr / a scrapbook desktop"
}

image_backend="ascii"
image_source="$HOME/.config/neofetch/paper-ascii.txt"
ascii_colors=(3 7 3 7 3 7 7)
bold="on"
underline="off"
color_blocks="off"
gap=2
yoffset=0
xoffset=2

title_fqdn="off"
kernel_shorthand="on"
uptime_shorthand="on"
package_managers="on"
shell_path="off"
shell_version="on"
distro_shorthand="on"
os_arch="on"

memory_percent="on"
memory_unit="gib"
cpu_brand="on"
cpu_cores="logical"
gpu_brand="on"
gpu_type="all"

speed_time="off"
