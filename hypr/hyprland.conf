# ─────────────────────────────────────────────────────────────────────────────
#  Paperr · Hyprland
#  A warm, hand-cut paper desktop for Arch Linux.
#
#  Requires Hyprland 0.56+ (the window/layer rule syntax below is the new one).
#  Every colour name is a little scrap of the palette:
#    paper  #f4f1ea   ink    #2c2c2c   blue   #7fa8c9
#    red    #a64e42   orange #cc9056   sage   #8b9b7d
# ─────────────────────────────────────────────────────────────────────────────

$mainMod = SUPER
$terminal = kitty
$menu = wofi --show drun
$fileManager = nautilus
$browser = firefox

# ── Monitors ────────────────────────────────────────────────────────────────
# Let Hyprland choose the preferred mode. Change this if you have a special
# monitor layout (e.g. monitor = DP-1, 2560x1440@144, 0x0, 1).
monitor = , preferred, auto, 1

# ── Environment ─────────────────────────────────────────────────────────────
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = GDK_BACKEND, wayland,x11
env = XDG_SESSION_TYPE, wayland
env = MOZ_ENABLE_WAYLAND, 1
env = ELECTRON_OZONE_PLATFORM_HINT, auto

# ── Autostart ───────────────────────────────────────────────────────────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = hyprpaper
exec-once = waybar
exec-once = sleep 1 && ~/.config/eww/scripts/start-widgets.sh
exec-once = gsettings set org.gnome.desktop.interface color-scheme default

# ── Look: thick, warm, layered paper ────────────────────────────────────────
general {
    gaps_in = 8
    gaps_out = 22
    border_size = 4
    col.active_border = rgba(f4f1eaff) rgba(e7dcc8ff) 35deg
    col.inactive_border = rgba(cfc3b0aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 3
    rounding_power = 3.0
    active_opacity = 1.0
    inactive_opacity = 0.98
    fullscreen_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.06
    shadow {
        enabled = true
        range = 22
        render_power = 3
        color = rgba(44,44,44,0.26)
        color_inactive = rgba(44,44,44,0.10)
        offset = 2 7
    }
    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }
}

# A gentle paper-settle instead of a hard snap.
animations {
    enabled = true
    bezier = paper, 0.22, 1.0, 0.36, 1.0
    bezier = settle, 0.16, 0.84, 0.44, 1.0
    animation = windows, 1, 5, paper, popin 85%
    animation = windowsOut, 1, 4, settle, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 6, default
    animation = workspaces, 1, 5, paper, slide
    animation = specialWorkspace, 1, 5, paper, slidevert
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
}

master {
    new_status = master
    mfact = 0.55
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    disable_splash_rendering = true
    font_family = Caveat
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = true
}

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = compose:ralt
    follow_mouse = 1
    sensitivity = 0
    numlock_by_default = false
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        scroll_factor = 0.8
    }
}

binds {
    workspace_back_and_forth = true
    allow_workspace_cycles = true
    pass_mouse_when_bound = false
}

# ── Keys ────────────────────────────────────────────────────────────────────
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Space, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, E, exit
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, P, pseudo
bind = $mainMod ALT, J, layoutmsg, togglesplit
bind = $mainMod, C, centerwindow
bind = $mainMod, Escape, exec, ~/.config/eww/scripts/toggle-widgets.sh
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod ALT, L, exec, loginctl lock-session

# Focus and movement (vim keys and arrows both work).
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod, Tab, cyclenext
bind = $mainMod, grave, togglespecialworkspace, magic

# Workspaces 1–9 and 0 for 10.
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Media, volume and brightness.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshots (clipboard or file).
bind = , Print, exec, grim - | wl-copy
bind = $mainMod SHIFT, S, exec, mkdir -p ~/Pictures; grim -g "$(slurp)" ~/Pictures/paperr-$(date +%Y%m%d-%H%M%S).png
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | wl-copy

# Mouse: drag and resize with the paper border.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ── Window rules: different hand-cut border widths ─────────────────────────
# Hyprland can't draw a truly wobbly outline, so we vary the thickness and
# rounding from window to window and keep the edges warm and soft.
windowrule = match:class ^(kitty)$, border_size 5, rounding 4
windowrule = match:class ^(firefox)$, border_size 4, rounding 3
windowrule = match:class ^(org.gnome.Nautilus)$, border_size 5, rounding 2
windowrule = match:class ^(org.gnome.Nautilus)$, opacity 1.0 0.98
windowrule = match:class ^(mpv)$, border_size 3, rounding 2
windowrule = match:class ^(pavucontrol)$, float on, size 820 560, center on
windowrule = match:class ^(nm-connection-editor)$, float on, size 820 560, center on
windowrule = match:class ^(wofi)$, border_size 0, rounding 0
windowrule = match:title ^(Picture-in-Picture)$, float on, pin on, size 520 300, move 72% 12%
windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on, center on

# A little blur behind our paper layers, not enough to lose the grain.
layerrule = match:namespace waybar, blur on, ignore_alpha 0.1
layerrule = match:namespace eww, blur on, ignore_alpha 0.1
