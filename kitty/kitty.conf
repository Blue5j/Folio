# ─────────────────────────────────────────────────────────────────────────────
#  Paperr · kitty
#  A sheet of paper with a fountain-pen cursor.  The texture is a real PNG,
#  not a flat colour, so the terminal still feels like a desk under lamplight.
#  setup.sh replaces @HOME@ with your home directory.
# ─────────────────────────────────────────────────────────────────────────────

# ── type ─────────────────────────────────────────────────────────────────────
font_family                 FiraCode Nerd Font
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
font_size                   11.5
modify_font                 cell_height 112%
disable_ligatures           never

# ── paper and ink ────────────────────────────────────────────────────────────
foreground                  #2c2c2c
background                  #f4f1ea
background_opacity          0.97
dynamic_background_opacity  yes
background_blur             0
background_image            @HOME@/.config/kitty/paper-texture.png
background_image_layout     tiled
background_image_linear     no
background_tint             0.03
selection_foreground        #2c2c2c
selection_background        #bcd7e8
cursor                      #a64e42
cursor_text_color           #f4f1ea
cursor_shape                beam
cursor_blink_interval       0.55
cursor_stop_blinking_after  20
url_color                   #5f7f95
url_style                   curly
underline_hyperlinks        hover
mouse_hide_wait             2.0

# Warm, slightly faded pastels.  Colour 0 is ink; colour 15 is the margin.
color0   #2c2c2c
color8   #6e6458
color1   #a64e42
color9   #c26a5d
color2   #70855f
color10  #8b9b7d
color3   #b9853f
color11  #cc9056
color4   #5f7f95
color12  #7fa8c9
color5   #8b6f86
color13  #a98aa1
color6   #5f8a86
color14  #86aaa5
color7   #d8cfbf
color15  #fbf8f1

# ── window paper edge ────────────────────────────────────────────────────────
window_padding_width        22 28 22 28
window_margin_width         0
window_border_width         2
active_border_color         #7fa8c9
inactive_border_color       #d8cbb6
bell_border_color           #cc9056
draw_minimal_borders        yes
single_window_margin_width  -1
resize_debounce_time        0.1
window_resize_step_cells    2
window_resize_step_lines    2

# ── tabs: index cards tucked under the page ─────────────────────────────────
tab_bar_edge                bottom
tab_bar_style               separator
tab_bar_min_tabs            2
tab_bar_margin_width        0
tab_bar_margin_color        #d8cbb6
tab_bar_background          #f4f1ea
tab_separator               " │ "
tab_title_template          "{title}"
active_tab_background       #e8dfd0
active_tab_foreground       #2c2c2c
active_tab_font_style       bold
inactive_tab_background     #f4f1ea
inactive_tab_foreground     #8d8171
inactive_tab_font_style     normal

# ── quiet, papery behaviour ─────────────────────────────────────────────────
scrollback_lines            10000
scrollbar                   auto
scrollbar_interactive       yes
scrollbar_width             6
scrollbar_handle_color      #b7a995
copy_on_select              no
strip_trailing_spaces       smart
confirm_os_window_close     0
enable_audio_bell           no
visual_bell_duration        0.0
window_alert_on_bell        no
remember_window_size        yes
initial_window_width        92c
initial_window_height       28c
focus_follows_mouse         no
shell_integration           enabled
allow_remote_control        no
update_check_interval       0

# ── little shortcuts ───────────────────────────────────────────────────────
map ctrl+shift+f5 new_tab neofetch
map ctrl+shift+enter new_window
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+plus  change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0
